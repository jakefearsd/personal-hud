services:
  db:
    image: postgres:16
    container_name: hud-db
    environment:
      POSTGRES_DB: hud
      POSTGRES_USER: huduser
      POSTGRES_PASSWORD: hudpass
    ports:
      - "6432:5432"
    volumes:
      - hud_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huduser -d hud"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hud-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8889:8888"
    environment:
      DB_URL: jdbc:postgresql://db:5432/hud
      DB_USER: huduser
      DB_PASS: hudpass
      HUD_ADMIN_PASSWORD: admin
    restart: always

volumes:
  hud_db_data:
