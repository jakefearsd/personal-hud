server:
  port: 8888
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6432/hud}
    username: ${DB_USER:huduser}
    password: ${DB_PASS:hudpass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

langchain4j:
  ollama:
    chat-model:
      base-url: http://inference.jakefear.com:11434
      model-name: gemma4:e4b
      num-ctx: 131072
      timeout: PT10M
      temperature: 0.0
